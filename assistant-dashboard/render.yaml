services:
  - type: web
    name: assistant-dashboard
    runtime: node
    buildCommand: npm ci
    startCommand: node simple-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
